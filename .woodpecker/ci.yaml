# Run CI for R using https://eddelbuettel.github.io/r-ci/

when:
  - event: [manual, push, pull_request]

variables:
  env: &env
    _R_CHECK_FORCE_SUGGESTS_: "false"

matrix:
  IMAGE:
    - rocker/r2u:noble

steps:
  - name: Setup
    image: ${IMAGE}
    pull: true
    environment:
      <<: *env
    commands: 
      - apt update -qq && apt install --yes --no-install-recommends curl
      - curl -OLs https://eddelbuettel.github.io/r-ci/run.sh && chmod 0755 run.sh
      - ./run.sh bootstrap

  - name: Dependencies
    image: ${IMAGE}
    depends_on: [Setup]
    environment:
      <<: *env
    commands:
      - ./run.sh install_all

  - name: Test
    image: ${IMAGE}
    depends_on: [Dependencies]
    environment:
      <<: *env
    commands:
      - ./run.sh run_tests

