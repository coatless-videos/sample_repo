# Run CI for R using https://eddelbuettel.github.io/r-ci/
# Actually using simpler rocker/r2u:noble container

when:
  - event: [manual, push, pull_request]

variables:
  env: &env
    _R_CHECK_FORCE_SUGGESTS_: "false"

matrix:
  container:
    - rocker/r2u:noble

steps:
  - name: Setup
    image: ${container}
    pull: true
    environment:
      <<: *env
    commands:
      - echo "Nothing to here"

  - name: Dependencies
    image: ${container}
    depends_on: [Setup]
    environment:
      <<: *env
    commands:
      - installDeps.r 

  - name: Test
    image: ${container}
    depends_on: [Dependencies]
    environment:
      <<: *env
    commands:
      - install.r rcmdcheck
      - /usr/lib/R/site-library/littler/examples/rcc.r --fast --as-cran
      # TODO: link this into /usr/local/bin for r2u
      
