# Run CI for R using https://eddelbuettel.github.io/r-ci/
# Actually using simpler rocker/r2u:noble container

when:
  - event: [manual, push, pull_request]

variables:
  env: &env
    _R_CHECK_FORCE_SUGGESTS_: "false"

matrix:
  container:
    - rocker/r2u:noble

steps:
  - name: Install Deps and Test
    image: ${container}
    pull: true
    environment:
      <<: *env
    commands:
      # use dependencies=TRUE for Suggests as well
      - Rscript -e 'remotes::install_deps(".", dependencies=NA)' 
      - R CMD build --no-manual --no-build-vignettes .
      - R CMD check --as-cran --no-manual --no-vignettes $(ls -1 *.tar.gz | head -1)
      
    
