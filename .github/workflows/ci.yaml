# Run R CMD check inside the rocker/r2u container, with the commands from .woodpecker/ci.yaml

name: ci

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: rocker/r2u:noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: Rscript -e 'remotes::install_deps(".", dependencies=NA)'

      - name: Build
        run: R CMD build --no-manual --no-build-vignettes .

      - name: Check
        run: R CMD check --as-cran --no-manual --no-vignettes $(ls -1 *.tar.gz | head -1)
